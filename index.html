<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOTICIA DE PRUEBA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 3.5rem 2.5rem;
      border-radius: 1.25rem;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.05);
      text-align: center;
      max-width: 650px;
      width: 100%;
      z-index: 10;
    }

    .title-main {
      font-size: 2.5rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }

    .title-highlight {
      font-size: 2.25rem;
      font-weight: 900;
      display: block; /* Salto de línea */
      letter-spacing: -0.01em;
      margin-bottom: 2rem;
      transition: color 0.1s linear, text-shadow 0.1s linear;
    }

    .signature {
      font-size: 1.5rem;
      font-weight: 700;
      font-style: italic;
      color: #64748b;
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      z-index: 1;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="title-main">NOTICIA DE PRUEBA</h1>
    <span id="animated-text" class="title-highlight">NO REGISTRAR</span>
    <p class="signature">Att: Juanpis :)</p>
  </div>

  <script>
    // --- Cambio de color para "NO REGISTRAR" ---
    const animatedText = document.getElementById('animated-text');
    let hue = 0;

    function animateColor() {
      hue = (hue + 2) % 360;
      const mainColor = `hsl(${hue}, 100%, 50%)`;
      const glowColor = `hsl(${hue}, 100%, 70%)`;

      animatedText.style.color = mainColor;
      animatedText.style.textShadow = `0 2px 12px ${glowColor}`;

      requestAnimationFrame(animateColor);
    }

    // --- Lógica del Confeti ---
    function createConfetti(isLeft) {
      const confetti = document.createElement('div');
      confetti.classList.add('confetti');
      
      const randomHue = Math.random() * 360;
      confetti.style.backgroundColor = `hsl(${randomHue}, 90%, 65%)`;
      confetti.style.bottom = '-10px';

      if (isLeft) {
        confetti.style.left = (Math.random() * 60) + 'px';
      } else {
        confetti.style.right = (Math.random() * 60) + 'px';
      }

      document.body.appendChild(confetti);

      const velocityX = (Math.random() - 0.5) * 8 + (isLeft ? 3 : -3);
      const velocityY = (Math.random() * 12 + 10) * -1;
      const rotation = Math.random() * 360;
      const rotationSpeed = (Math.random() - 0.5) * 20;

      const animation = confetti.animate([
        { transform: `translate(0, 0) rotate(${rotation}deg)`, opacity: 1 },
        { 
          transform: `translate(${velocityX * 20}px, ${velocityY * 20}px) rotate(${rotation + rotationSpeed * 20}deg)`,
          opacity: 0 
        }
      ], {
        duration: Math.random() * 1000 + 1000,
        easing: 'ease-out',
        iterations: 1
      });

      animation.onfinish = () => confetti.remove();
    }

    function startConfettiLoop() {
      setTimeout(() => {
        createConfetti(true);
        startConfettiLoop();
      }, Math.random() * 150 + 50);

      setTimeout(() => {
        createConfetti(false);
      }, Math.random() * 150 + 100); 
    }

    animateColor();
    startConfettiLoop();
  </script>

</body>
</html>
