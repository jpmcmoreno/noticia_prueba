<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noticia de Prueba</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* Fondo claro: gris muy suave */
      background-color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 2rem;
      position: relative; /* Necesario para el confeti */
      overflow: hidden; /* Evita scrolls por el confeti */
    }

    .card {
      /* Estilo claro para la tarjeta */
      background: rgba(255, 255, 255, 0.9);
      padding: 3rem 2.5rem;
      border-radius: 1.25rem;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(0, 0, 0, 0.05);
      text-align: center;
      max-width: 650px;
      width: 100%;
      z-index: 10; /* Asegura que la tarjeta esté sobre el confeti */
    }

    .title {
      font-size: 2.25rem;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 2rem;
      letter-spacing: -0.025em;
      transition: color 0.1s linear, text-shadow 0.1s linear;
    }

    .signature {
      font-size: 1.5rem;
      font-weight: 700;
      font-style: italic;
      /* Color fijo y suave para el texto en fondo claro */
      color: #64748b;
    }

    /* Estilos para las partículas de confeti */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      z-index: 1; /* Detrás de la tarjeta */
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="title" class="title">NOTICIA DE PRUEBA</h1>
    <span id="animated-text" class="title-highlight">NO REGISTRAR</span>
    <p class="signature">Att: Juanpis :)</p>
  </div>

  <script>
    // --- Lógica del Título Animado ---
    const titleEl = document.getElementById('title');
    let hue = 0;

    function animateTitle() {
      // Rotación rápida por la rueda de colores (HSL)
      hue = (hue + 2) % 360;
      
      // Colores vibrantes y saturados
      const mainColor = `hsl(${hue}, 100%, 55%)`; 
      // Resplandor ligero del mismo color
      const glowColor = `hsl(${hue}, 100%, 70%)`; 

      titleEl.style.color = mainColor;
      // Añadimos un pequeño "glow" para que resalte más en el fondo claro
      titleEl.style.textShadow = `0 2px 10px ${glowColor}`;

      requestAnimationFrame(animateTitle);
    }

    // --- Lógica del Confeti (Esquinas Inferiores) ---
    function createConfetti(isLeft) {
      const confetti = document.createElement('div');
      confetti.classList.add('confetti');
      
      // Color aleatorio para cada papelito
      const randomHue = Math.random() * 360;
      confetti.style.backgroundColor = `hsl(${randomHue}, 90%, 65%)`;

      // Posición inicial: esquinas inferiores
      confetti.style.bottom = '-10px';
      if (isLeft) {
        confetti.style.left = (Math.random() * 50) + 'px'; // Rango en la izquierda
      } else {
        confetti.style.right = (Math.random() * 50) + 'px'; // Rango en la derecha
      }

      document.body.appendChild(confetti);

      // Variables de movimiento aleatorias (efecto explosión hacia arriba)
      const velocityX = (Math.random() - 0.5) * 8 + (isLeft ? 3 : -3); // Dirección lateral
      const velocityY = (Math.random() * 12 + 10) * -1; // Fuerza hacia arriba
      const rotation = Math.random() * 360;
      const rotationSpeed = (Math.random() - 0.5) * 20;

      // Animación simple usando Web Animations API
      const animation = confetti.animate([
        { transform: `translate(0, 0) rotate(${rotation}deg)`, opacity: 1 },
        { 
          transform: `translate(${velocityX * 20}px, ${velocityY * 20}px) rotate(${rotation + rotationSpeed * 20}deg)`,
          opacity: 0 
        }
      ], {
        duration: Math.random() * 1000 + 1000, // Duración aleatoria
        easing: 'ease-out',
        iterations: 1
      });

      // Limpiar el elemento al terminar
      animation.onfinish = () => confetti.remove();
    }

    // Intervalo para generar confeti desde ambas esquinas
    function startConfettiLoop() {
      // Izquierda
      setTimeout(() => {
        createConfetti(true);
        startConfettiLoop(); // Recursión para bucle infinito
      }, Math.random() * 150 + 50); // Tiempo aleatorio entre lanzamientos

      // Derecha
      setTimeout(() => {
        createConfetti(false);
      }, Math.random() * 150 + 100); 
    }

    // Iniciar ambas animaciones
    animateTitle();
    startConfettiLoop();
  </script>

</body>
</html>
